name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8 (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_mingw'
          modules: 'qtmultimedia'
          tools: 'tools_mingw1310'
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          $version = 'dev'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME }
          $log = cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DAPP_VERSION=$version" 2>&1
          $log | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            $log | Select-Object -Last 25 | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          $log = cmake --build build --parallel 2>&1
          $log | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            $log | Select-Object -Last 40 | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      - name: Deploy runtime and pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\CoinFlip.exe dist\
          windeployqt --release --no-translations --dir dist dist\CoinFlip.exe
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "CoinFlip-$($env:GITHUB_REF_NAME)-windows-x64.zip" } else { "CoinFlip-dev-windows-x64.zip" }
          Compress-Archive -Path dist\* -DestinationPath $name
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoinFlip-windows-x64
          path: dist/

      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
