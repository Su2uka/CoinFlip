name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION=$version

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy runtime and pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\CoinFlip.exe dist\
          windeployqt --release --no-translations --dir dist dist\CoinFlip.exe
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "CoinFlip-$($env:GITHUB_REF_NAME)-windows-x64.zip" } else { "CoinFlip-dev-windows-x64.zip" }
          Compress-Archive -Path dist\* -DestinationPath $name
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoinFlip-windows-x64
          path: dist/

      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
